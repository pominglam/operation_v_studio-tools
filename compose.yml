services:
  mysql:
    image: mysql:8.4
    container_name: pricing-tool-mysql
    environment:
      TZ: America/Toronto
      MYSQL_DATABASE: pricing_tool
      MYSQL_USER: pricing_tool
      MYSQL_PASSWORD: pricing_tool
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pricing_tool_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pricing-tool-php
    environment:
      TZ: America/Toronto
      # Vite is running on the host (local Node). Container must point to host.docker.internal.
      VITE_DEV_SERVER_URL: http://host.docker.internal:5173
      # Avoid running long crawls inside HTTP requests (PHP built-in server is single-process).
      # Use the dedicated `queue` service below instead.
      PRICE_RESEARCH_LOCAL_INLINE_FALLBACK: "false"
      QUEUE_CONNECTION: database
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      # Local-only: allows the web UI to start/stop the cloudflared container for the Shopify image tunnel.
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /var/www/html
    user: "0:0"
    ports:
      - "8020:8080"
    networks:
      - pricing_tool_net
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]

  # Images-only HTTP entrypoint for Shopify CSV imports (exposed through cloudflared quick tunnel).
  # This service must not expose the rest of the web UI.
  shopify_images:
    container_name: pricing-tool-shopify-images
    environment:
      TZ: America/Toronto
    depends_on:
      shopify_images_php:
        condition: service_started
      mysql:
        condition: service_healthy
    image: nginxinc/nginx-unprivileged:1.27.3-alpine
    volumes:
      - .:/var/www/html:ro
      - ./docker/shopify-images/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:8081"
    networks:
      - pricing_tool_net
    restart: unless-stopped

  shopify_images_php:
    build:
      context: .
      dockerfile: docker/php-fpm/Dockerfile
    container_name: pricing-tool-shopify-images-php
    environment:
      TZ: America/Toronto
      SHOPIFY_IMAGES_ONLY: "true"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    user: "0:0"
    networks:
      - pricing_tool_net
    restart: unless-stopped
    command:
      [
        "sh",
        "-lc",
        "chmod -R a+rX storage/app/private/plamod storage/app/private/exports 2>/dev/null || true; exec php-fpm",
      ]

  # Cloudflare quick tunnel (trycloudflare). Fully managed by the Web UI via Docker Engine API.
  cloudflared:
    image: cloudflare/cloudflared:2024.12.0
    container_name: pricing-tool-cloudflared
    depends_on:
      - shopify_images
    networks:
      - pricing_tool_net
    restart: unless-stopped
    # Use HTTP/2 instead of QUIC for improved stability (QUIC can be flaky on some hosts / networks).
    command: ["tunnel", "--url", "http://shopify_images:8081", "--protocol", "http2", "--no-autoupdate"]

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pricing-tool-queue
    environment:
      TZ: America/Toronto
      QUEUE_CONNECTION: database
      PRICE_RESEARCH_LOCAL_INLINE_FALLBACK: "false"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    user: "0:0"
    networks:
      - pricing_tool_net
    restart: unless-stopped
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "--queue=price_research,pdp_sync,default",
        "--sleep=1",
        "--tries=1",
        "--timeout=600",
      ]

  aliexpress_scraper:
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    container_name: pricing-tool-aliexpress-scraper
    environment:
      TZ: America/Toronto
      PORT: "3000"
      ALIEXPRESS_BASE_URL: https://www.aliexpress.com
      # Best-effort: ask AliExpress to display CAD (may still vary by region).
      ALIEXPRESS_CURRENCY: CAD
      # Persistent Playwright profile directory (stored on the host via the /app bind mount).
      ALIEXPRESS_PERSISTENT_PROFILE_DIR: /app/.pw-user-data
      # Optional: pass your own browser session cookies as a JSON array (Playwright cookie format).
      # Set on host before `docker compose up`: $env:ALIEXPRESS_COOKIES_JSON='[...]'
      ALIEXPRESS_COOKIES_JSON: ${ALIEXPRESS_COOKIES_JSON-}
    volumes:
      - ./node/aliexpress-scraper:/app
    working_dir: /app
    networks:
      - pricing_tool_net
    restart: unless-stopped
    command: ["bash", "-lc", "npm ci --silent && node server.js"]

  plamod_scraper:
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    container_name: pricing-tool-plamod-scraper
    env_file:
      - path: .env
        format: raw
    environment:
      TZ: America/Toronto
      PORT: "3001"
      PLAMOD_BASE_URL: https://plamod.com
      PLAMOD_PERSISTENT_PROFILE_DIR: /app/.pw-user-data
      # Shared with Laravel container for storing downloaded ZIPs.
      PLAMOD_STORAGE_ROOT: /var/www/html/storage/app/private
    volumes:
      - .:/var/www/html
      - ./node/plamod-scraper:/app
    working_dir: /app
    networks:
      - pricing_tool_net
    restart: unless-stopped
    command: ["bash", "-lc", "npm ci --silent && node server.js"]

volumes:
  mysql_data:
    name: pricing-tool-mysql-data

networks:
  pricing_tool_net:
    name: pricing-tool-net


