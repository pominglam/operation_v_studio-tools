server {
    listen 8081;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Docker embedded DNS — resolve upstream at request time so PHP container IP changes
    # (recreate/restart) do not leave nginx pointing at a stale cached address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/index\.php(/|$) {
        set $shopify_images_php_upstream shopify_images_php:9000;
        fastcgi_pass $shopify_images_php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}






